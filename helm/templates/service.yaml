apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-postgres-toolkit.fullname" . }}
  labels:
    {{- include "mcp-postgres-toolkit.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "mcp-postgres-toolkit.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
