apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-postgres-toolkit.fullname" . }}-secret
  labels:
    {{- include "mcp-postgres-toolkit.labels" . | nindent 4 }}
type: Opaque
data:
  DB_HOST: {{ .Values.postgres.host | b64enc | quote }}
  DB_USER: {{ .Values.postgres.user | b64enc | quote }}
  DB_PASSWORD: {{ .Values.postgres.password | b64enc | quote }}
  DB_NAME: {{ .Values.postgres.database | b64enc | quote }}
