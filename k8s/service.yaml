apiVersion: v1
kind: Service
metadata:
  name: mcp-toolbox
  namespace: mcp-db
  labels:
    app.kubernetes.io/name: mcp-postgres-toolkit
    app.kubernetes.io/component: server
spec:
  # ClusterIP is the default and most secure option.
  # The MCP Toolbox is only reachable from within the cluster.
  #
  # To expose externally, change to NodePort:
  #   type: NodePort
  #   ports:
  #     - port: 5000
  #       targetPort: http
  #       nodePort: 30500    # pick a port in 30000-32767
  #
  # Or use a LoadBalancer (cloud providers):
  #   type: LoadBalancer
  #
  # Or use an Ingress resource for HTTP routing.
  type: ClusterIP
  selector:
    app: mcp-toolbox
  ports:
    - port: 5000
      targetPort: http
      protocol: TCP
      name: http
