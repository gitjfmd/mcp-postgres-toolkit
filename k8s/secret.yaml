# IMPORTANT: Replace the base64-encoded values below with your actual credentials.
#
# To encode a value:
#   echo -n "your-value" | base64
#
# Examples:
#   echo -n "myuser"   | base64  =>  bXl1c2Vy
#   echo -n "changeme" | base64  =>  Y2hhbmdlbWU=
#   echo -n "mydb"     | base64  =>  bXlkYg==
