apiVersion: v1
kind: Secret
metadata:
  name: mcp-toolbox-postgres
  namespace: mcp-db
  labels:
    app.kubernetes.io/name: mcp-postgres-toolkit
    app.kubernetes.io/component: database
type: Opaque
data:
  # echo -n "your-username" | base64
  DB_USER: Y2hhbmdlLW1l
  # echo -n "your-password" | base64
  DB_PASSWORD: Y2hhbmdlLW1l
  # echo -n "your-database" | base64
  DB_NAME: Y2hhbmdlLW1l
  # echo -n "your-postgres-host" | base64
  DB_HOST: Y2hhbmdlLW1l
